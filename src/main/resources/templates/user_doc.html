<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Registration</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Мои заявки</h2>
                <form th:action="@{createApplication}" th:method="get">
                    <input type="hidden" name="userID" class="btn btn-primary" th:value="${userID}">
                    <div class="form-group" style="margin-top: 1rem;">
                        <input type="submit" name="submit" class="btn btn-primary" value="Создать заявку">
                    </div>
                </form>
                <div th:each="visaData : ${visasData}" class="card" style="padding: 1rem; margin: 1rem 0;" >
                    <div
                        style="display:flex; flex-direction: row; justify-content: space-between; align-items: center;">
                        <section style="display:flex; flex-direction: row;">
                            <p>Номер заявки: </p>
                            <p th:text="${visaData.id}" style="font-size: large; font-weight: 900; margin-left: 0.5rem;"></p>
                        </section>

                        <section style="display:flex; flex-direction: row; align-items: center;">
                            <p style="margin: 0;">Статус</p>
                            <input th:if="${visaData.state == 0}" readonly type="text" name="status" required value="В работе"
                                style="margin-left: 0.5rem; width: 150px; height: 40px; padding: 0.5rem 1.5rem; background-color: rgb(21, 62, 151); border: none; border-radius: 8px; text-align: center; color: white;">
                            <input th:if="${visaData.state == 1}" readonly type="text" name="status" required value="Одобрено"
                                   style="margin-left: 0.5rem; width: 150px; height: 40px; padding: 0.5rem 1.5rem; background-color: rgb(25, 151, 21); border: none; border-radius: 8px; text-align: center; color: white;">
                            <input th:if="${visaData.state == 2}" readonly type="text" name="status" required value="Отклонена"
                                   style="margin-left: 0.5rem; width: 150px; height: 40px; padding: 0.5rem 1.5rem; background-color: rgb(151, 21, 21); border: none; border-radius: 8px; text-align: center; color: white;">
                        </section>

                    </div>
                    <section style="display:flex; flex-direction: row;">
                        <p>Имя мигранта: </p>
                        <p th:text="${visaData.nameMigrant}" style="font-size: large; font-weight: 900; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Комментарий: </p>
                        <p th:text="${visaData.comment}" style="font-size: large; font-weight: 900; margin-left: 0.5rem;"></p>
                    </section>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
