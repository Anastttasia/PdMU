<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Авторизация</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">

                <h2>Вход</h2>
                <p>Введите свою почту и пароль.</p>

                <form action="loginAction" method="post">

                    <div class="form-group">
                        <label>Электронная почта</label>
                        <input type="email" name="email" class="form-control" required placeholder="primer@gmail.com"/>
                    </div>

                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" name="password" class="form-control" required placeholder="****">
                    </div>

                    <div class="form-group" style="margin-top: 1rem;">
                        <input type="submit" name="submit" class="btn btn-primary" value="Войти">
                    </div>

                    <p>Нет аккаунта? <a href="registration">Создайте его за минуту</a>.</p>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
