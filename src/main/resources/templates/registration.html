<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Регистрация</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Регистрация</h2>
                <p>Заполните все поля, чтобы создать новый аккаунт.</p>
                <form action="regAction" method="post">
                    <div class="form-group">
                        <label>Электронная почта</label>
                        <label th:if="${errorsChecker.isEmailError}" style="color: red;">ОШИБКА ВВОДА</label>
                        <input type="email" name="email" class="form-control" required placeholder="primer@gmail.com"/>
                    </div>

                    <div class="form-group">
                        <label>Пароль</label>
                        <label th:if="${errorsChecker.isPasswordError}" style="color: red;">ПАРОЛИ НЕ СОВПАЛИ</label>
                        <input type="password" name="password" class="form-control" required placeholder="****">
                    </div>

                    <div class="form-group">
                        <label>Повторите пароль</label>
                        <label th:if="${errorsChecker.isPasswordError}" style="color: red;">ПАРОЛИ НЕ СОВПАЛИ</label>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="****">
                    </div>

                    <div class="form-group">
                        <label>ФИО</label>
                        <input type="text" name="fio" class="form-control" required placeholder="Иванов Иван Иванович">
                    </div>

                    <div class="form-group">
                        <label>Серия и номер паспорта</label>
                        <label th:if="${errorsChecker.isPassportError}" style="color: red;">ОШИБКА ВВОДА</label>
                        <input type="text" name="passport" class="form-control" required placeholder="4142123456">
                    </div>

                    <div class="form-group">
                        <label>Адрес прописки</label>
                        <input type="text" name="address" class="form-control" required>
                    </div>

                    <div class="form-group" style="margin-top: 1rem;">
                        <input type="submit" name="submit" class="btn btn-primary" value="Зарегистрироваться">
                    </div>

                    <p>Уже зарегистрированы? <a href="login">Войдите в систему</a>.</p>
                </form>
            </div>

        </div>
    </div>
</body>

</html>
