<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Новая заявка</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Заявка </h2>

                <div class="card" style="padding: 1rem; margin: 1rem 0;" >
                    <p style="font-size: x-large; font-weight: 900; margin-left: 0.5rem;">Ваши данные</p>
                    <section style="display:flex; flex-direction: row;">
                        <p>Имя собственника: </p>
                        <p th:text="${ownerData.name}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Серия и номер паспорта собственника: </p>
                        <p th:text="${ownerData.passport}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Адрес прописки: </p>
                        <p th:text="${ownerData.address}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                </div>

                <p style="font-size: large; font-weight: 600; margin-left: 0.5rem;">Заполните информацию по мигранту:</p>
                <form action="newApplication" method="post">
                    <input type="hidden" name="userID" class="btn btn-primary" th:value="${userID}">

                    <div class="form-group">
                        <label>Имя мигранта</label>
                        <input type="text" name="nameMigrant" class="form-control" required
                            placeholder="Формат: Фамилия Имя Отчество (при наличии)">
                    </div>

                    <div class="form-group">
                        <label>Серия и номер паспорта мигранта</label>
                        <input type="text" name="passportMigrant" class="form-control" required
                            placeholder="Формат: в строку через пробел">
                    </div>


                    <div class="form-group" style="margin-top: 0.5rem;">
                        <label>Выберите гражданство</label>
                        <select name="citizenshipMigrant" class="form-select" aria-label="Default select example">
                            <option value="Беларусь">Беларусь</option>
                            <option value="Казахстан">Казахстан</option>
                            <option value="Узбекистан">Узбекистан</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-top: 1rem;">
                        <input type="submit" name="submit" class="btn btn-primary" value="Создать заявку">
                    </div>

                </form>
            </div>

        </div>
    </div>
</body>

</html>
