<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Админ</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Заявки</h2>

                <div th:each="visaData : ${visasData}" class="card" style="padding: 1rem; margin: 1rem 0;">
                    <div
                        style="display:flex; flex-direction: row; justify-content: space-between; align-items: center;">
                        <section style="display:flex; flex-direction: row;">
                            <p>Номер заявки: </p>
                            <p th:text="${visaData.id}" style="font-size: large; font-weight: 900; margin-left: 0.5rem;"></p>
                        </section>

                    </div>
                    <section style="display:flex; flex-direction: row;">
                        <p>Имя собственника: </p>
                        <p th:text="${visaData.nameOwner}" style="font-size: large; font-weight: 900; margin-left: 0.5rem;"></p>
                    </section>
                    <section style="display:flex; flex-direction: row;">
                        <p>Имя мигранта: </p>
                        <p th:text="${visaData.nameMigrant}" style="font-size: large; font-weight: 900; margin-left: 0.5rem;"></p>
                    </section>

                    <div class="form-group" style="margin-top: 1rem;">
                        <form action="openApplication" method="post">
                            <input type="hidden" name="applicationID" class="btn btn-primary" th:value="${visaData.id}">
                            <input type="submit" name="submit" class="btn btn-primary" value="Взять в работу">
                        </form>

                    </div>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
