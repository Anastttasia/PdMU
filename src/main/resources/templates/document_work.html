<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Registration</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Заявка </h2>

                <div class="card" style="padding: 1rem; margin: 1rem 0;" >
                    <p style="font-size: x-large; font-weight: 900; margin-left: 0.5rem;">Инофрмация по заявке</p>
                    <section style="display:flex; flex-direction: row;">
                        <p>Имя собственника: </p>
                        <p th:text="${visaData.nameOwner}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Серия и номер паспорта собственника: </p>
                        <p th:text="${visaData.passportOwner}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Имя мигранта: </p>
                        <p th:text="${visaData.nameMigrant}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Серия и номер паспорта мигранта: </p>
                        <p th:text="${visaData.passportMigrant}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Гражданство: </p>
                        <p th:text="${visaData.citizenshipMigrant}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                    <section style="display:flex; flex-direction: row;">
                        <p>Адрес прописки: </p>
                        <p th:text="${visaData.address}" style="font-size: large; font-weight: 600; margin-left: 0.5rem;"></p>
                    </section>

                </div>

                <form action="setApplicationStatus" method="post">
                    <input type="hidden" name="applicationID" class="btn btn-primary" th:value="${visaData.id}">
                    <div class="form-group">
                        <label>Комментарий по заявке</label>
                        <input th:value="${visaData.comment}" type="text" name="comment" class="form-control" required style="height: 100px;">
                    </div>

                    <div class="form-group" style="margin-top: 0.5rem;">
                        <label>Выберите гражданство</label>
                        <select name="applicationStatus" class="form-select" aria-label="Default select example">
                            <option value="0">В работе</option>
                            <option value="1">Одобрено</option>
                            <option value="2">Отклонено</option>
                        </select>
                    </div>

                    <div class="form-check">
                        <input type="submit" class="btn btn-primary" value="Отправить" style="margin-top: 1rem;">
                    </div>


                </form>
            </div>

        </div>
    </div>
</body>

</html>
