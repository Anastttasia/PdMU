<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Registration</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Заявка </h2>
                <p>Инофрмация по заявке</p>
                <form action="" method="post">

                    <div class="form-group">
                        <label>Имя собственника</label>
                        <input type="text" name="name" class="form-control" required value="Иванов Иван Иванович">
                    </div>
                    <div class="form-group">
                        <label>Серия и номер паспорта собственника</label>
                        <input type="text" name="pasport_s" class="form-control" required value="4410 596845">
                    </div>

                    <div class="form-group">
                        <label>Имя мигранта</label>
                        <input type="text" name="name_m" class="form-control" required value="Лукашенко">
                    </div>

                    <div class="form-group">
                        <label>Серия и номер паспорта мигранта</label>
                        <input type="text" name="pasport_m" class="form-control" required value="4410 596845">
                    </div>

                    <div class="form-group">
                        <label>Гражданство</label>
                        <input type="text" name="pasport_m" class="form-control" required value="Беларусь">
                    </div>

                    <div class="form-group">
                        <label>Адрес прописки</label>
                        <input type="text" name="address" class="form-control" required
                            value="Санкт-Петербург, ул Кораблестроителей, д 2, кв 3">
                    </div>

                    <div class="form-group">
                        <label>Комментарий по заявке</label>
                        <input type="text" name="comment" class="form-control" required value="Просрочена виза"
                            style="height: 100px;">
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="agree" name="agreement" value="yes">
                        <label class="form-check-label" for="agree">Подтвердить заявку</label><br>

                        <input class="form-check-input" type="checkbox" id="disagree" name="agreement" value="no">
                        <label class="form-check-label" for="disagree">Отклонить заявку</label><br>

                        <input type="submit" class="btn btn-primary" value="Отправить" style="margin-top: 1rem;">

                    </div>


                </form>
            </div>

        </div>
    </div>
</body>

</html>
