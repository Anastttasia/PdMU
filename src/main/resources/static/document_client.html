<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="scc/styles.css">
    <title>Registration</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Ваша заявка </h2>
                <p>Инофрмация по заявке</p>
                <form action="" method="post">
                    <div class="status" style="margin: 1rem 0;">
                        <label>Статус</label>
                        <input readonly type="text" name="status" required value="В работе"
                            style="margin: 1rem 0; width: 120px; height: 40px; padding: 0.5rem 1.5rem; background-color: rgb(21, 62, 151); border: none; border-radius: 8px; text-align: center; color: white;">
                    </div>
                    <div class="form-group">
                        <label>Имя собственника</label>
                        <input readonly type="text" name="name" class="form-control" required
                            value="Иванов Иван Иванович">
                    </div>
                    <div class="form-group">
                        <label>Серия и номер паспорта собственника</label>
                        <input readonly type="text" name="pasport_s" class="form-control" required value="4410 596845">
                    </div>

                    <div class="form-group">
                        <label>Имя мигранта</label>
                        <input readonly type="text" name="name_m" class="form-control" required
                            value="Лукашенко Иван Иванович">
                    </div>

                    <div class="form-group">
                        <label>Серия и номер паспорта мигранта</label>
                        <input readonly type="text" name="pasport_m" class="form-control" required value="4410 596845">
                    </div>

                    <div class="form-group">
                        <label>Гражданство</label>
                        <input readonly type="text" name="pasport_m" class="form-control" required value="Беларусь">
                    </div>

                    <div class="form-group">
                        <label>Адрес прописки</label>
                        <input readonly type="text" name="address" class="form-control" required
                            value="Санкт-Петербург, ул Кораблестроителей, д 2, кв 3">
                    </div>

                    <div class="form-group">
                        <label>Комментарий по Вашей заявке</label>
                        <input readonly type="text" name="comment" class="form-control" required value="Просрочена виза"
                            style="height: 100px;">
                    </div>

                </form>
            </div>

        </div>
    </div>
</body>

</html>
